name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=packages/shared

      - name: Typecheck and compile all workspaces
        run: npm run build

      - name: Run unit, integration, and property test suites
        run: |
          node --test packages/shared/dist/index.test.js \
                      server/dist/services/auth.service.test.js \
                      tests/property/scoreboard.property.test.ts \
                      tests/property/rating.property.test.ts \
                      tests/integration/gateway_fencing.test.ts

      - name: Run hostile-program containment suite
        run: node --test tests/sandbox/hostile-runner.test.mjs
