services:
  - type: web
    name: dagna-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=server
    startCommand: node server/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_URL
        value: https://dagna-api.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: dagna-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CURSOR_SIGNING_KEY
        generateValue: true
      - key: JUDGE_NODE_TOKEN
        generateValue: true
      - key: JUDGING_ENABLED
        value: "true"
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false

  - type: redis
    name: dagna-redis
    plan: free
    ipAllowList: []
