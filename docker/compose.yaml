services:
  # MongoDB Single-Node Replica Set (rs0) for ACID transactions
  mongodb:
    image: mongo:7.0
    container_name: dagna-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 7.2 for Caching, Scoreboard Snapshots & BullMQ
  redis:
    image: redis:7.2-alpine
    container_name: dagna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO Object Storage (S3-compatible) for Problem Packages & Test Blobs
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: dagna-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Provisioning
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T19-39-01Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/dagna-problems;
      /usr/bin/mc mb --ignore-existing myminio/dagna-test-blobs;
      exit 0;
      "

  # Mailpit Local Email Catcher
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: dagna-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
  redis_data:
  minio_data:
